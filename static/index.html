<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hajiri · Smart Attendance</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/dashboard">
      <img src="/static/icon.svg" alt="" width="36" height="36">
      <div><b>Hajiri</b><small id="schoolName">Smart Attendance</small></div>
    </a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      <span class="provider-chip" id="providerChip"></span>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
